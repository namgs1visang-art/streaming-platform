server:
  port: 8091

spring:
  application:
    name: admin-api
  datasource:
    url: jdbc:postgresql://localhost:5432/streaming
    username: streaming
    password: streaming
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # 초기 개발용. 운영 전에는 Flyway로 전환 권장
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:              # 채팅 관리/퀴즈 출제 이벤트 발행 (chat-server 가 구독)
      host: localhost
      port: 6379

app:
  cors:
    allowed-origins: http://localhost:5173
  media:
    rtmp-base-url: rtmp://localhost/live      # OBS "서버" 칸에 들어갈 값
    hls-base-url: http://localhost:8080/live  # 시청 URL
    http-base-url: http://localhost:8080      # SRS http_server (녹화 mp4: {http-base-url}/dvr/...)
