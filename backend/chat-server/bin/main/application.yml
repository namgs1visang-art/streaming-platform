server:
  port: 8093

spring:
  application:
    name: chat-server
  datasource:
    url: jdbc:postgresql://localhost:5432/streaming
    username: streaming
    password: streaming
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: localhost
      port: 6379

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  chat:
    max-length: 200          # 메시지 최대 글자 수
    min-interval-ms: 500     # 도배 방지: 같은 연결에서 연속 전송 최소 간격
    write-interval-ms: 300   # 채팅 로그 DB 일괄 저장 주기
