server:
  port: 8082

spring:
  application:
    name: viewer-api
  datasource:
    url: jdbc:postgresql://localhost:5432/streaming
    username: streaming
    password: streaming
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: localhost
      port: 6379

app:
  cors:
    allowed-origins: http://localhost:5174
  media:
    hls-base-url: http://localhost:8080/live
  publish:
    require-schedule: false   # true: 편성된 시간에만 OBS 송출 허용
    early-minutes: 10         # 시작 몇 분 전부터 송출 허용할지
