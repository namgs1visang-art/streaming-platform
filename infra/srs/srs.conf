# SRS 설정 - OBS(RTMP) 수신 → HLS 변환 → 녹화(DVR) → Spring Boot 훅 호출

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {
    # HLS: http://localhost:8080/live/{채널코드}.m3u8
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_dispose     30;
    }

    # 송출 시작/종료/녹화완료 시 viewer-api(8082) 호출
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:8082/api/hooks/srs/on_publish;
        on_unpublish    http://host.docker.internal:8082/api/hooks/srs/on_unpublish;
        on_dvr          http://host.docker.internal:8082/api/hooks/srs/on_dvr;
    }

    # 방송 1회(세션) = mp4 파일 1개
    dvr {
        enabled         on;
        dvr_apply       all;
        dvr_plan        session;
        dvr_path        ./objs/nginx/html/dvr/[app]/[stream]/[timestamp].mp4;
    }
}
